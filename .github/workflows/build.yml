name: Compilar plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: DeathAnimation-jar
          path: target/DeathAnimation-*.jar
